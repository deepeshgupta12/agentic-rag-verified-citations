[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragverify"
version = "1.0.0"
description = "Evidence-gated multi-agent research: a pipeline that verifies its citations before it answers, and abstains when they don't hold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "agentic-rag", "rag", "retrieval-augmented-generation", "citation-verification",
    "hallucination-detection", "grounding", "self-correcting-rag", "corrective-rag",
    "multi-agent", "llm-agents", "ag2", "autogen", "bm25", "hybrid-search",
    "prompt-injection", "llm-evaluation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core engine deliberately depends on very little: BM25, chunking,
# grounding and the adaptive loop are pure Python. Streamlit, AG2 and PDF
# support are extras so the library can be embedded without them.
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "requests>=2.31",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.33", "pypdf>=4.2", "tiktoken>=0.7"]
ag2 = ["ag2[openai]>=0.11"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16,<0.17"]
all = ["ragverify[app,ag2,dev]"]

[project.scripts]
ragverify = "ragverify.cli:main"

[project.urls]
Homepage = "https://github.com/deepeshgupta12/agentic-rag-verified-citations"
Issues = "https://github.com/deepeshgupta12/agentic-rag-verified-citations/issues"
Changelog = "https://github.com/deepeshgupta12/agentic-rag-verified-citations/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ragverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "B008",   # argparse/pydantic defaults in signatures are intentional
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # sys.path juggling before imports
"evals/*" = ["E402"]

[tool.coverage.run]
source = ["ragverify"]
omit = ["ragverify/cli.py", "ragverify/ag2_team.py"]
