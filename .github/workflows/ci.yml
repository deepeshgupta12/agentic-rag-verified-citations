name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # tiktoken and pypdf are optional at runtime; install them so the
          # exact-token and PDF paths are exercised rather than the fallbacks.
          pip install tiktoken pypdf

      - name: Lint
        run: ruff check ragverify tests evals

      - name: Test
        # The suite is offline by design: no API key, no network. If a test
        # ever needs either, that is the bug.
        run: pytest --cov=ragverify --cov-report=term-missing

      - name: Verify the app imports
        run: |
          pip install streamlit
          python -c "import ast; ast.parse(open('app.py').read())"
          python -c "import ragverify; print('ragverify', ragverify.__version__)"

  eval:
    # Evals cost money, so they run only on demand and only when a key exists.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" tiktoken pypdf
      - name: Run eval set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python evals/run_eval.py --out results.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.json
